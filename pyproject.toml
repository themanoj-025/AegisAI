[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP", "SIM", "C4", "RUF", "PLC", "PIE", "I"]
ignore = [
    "BLE001",  # blind except — defensive coding
    "PLW1510", # subprocess.run without check — intentional
    "G201",    # logging exception — intentional
    "RUF034",  # positional match — legacy code
    "S110",    # try-except-pass — defensive coding
    "B008",    # FastAPI Depends() in defaults
    "E501",    # line too long — style preference
    "UP031",   # printf formatting — legacy code
    "PLC0415", # import-outside-top-level — lazy imports
    "SIM117",  # multiple with-statements
    "B904",    # raise-without-from — legacy code
    "T001",    # print found — intentional in scripts (now FIX001)
    "B025",    # duplicate exception — intentional defensive coding
    "F821",    # undefined name — pre-existing missing imports
    "FIX001",  # fixme/todo comments — intentional
    "SIM102",  # collapsible if — circuit breaker pattern
    "RUF043",  # comparison to literal
    "B011",    # do not call assert False
    "FIX001",  # fixme comments — intentional
    "E999",    # syntax error — pre-existing in test files
    "B017",    # blind exception assert — test pattern
    "N805",    # first argument should be self/cls
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
minversion = "7.0"
testpaths = ["tests"]

markers = [
    "slow: integration tests (database, HTTP, ML models) — excluded from default run; use pytest -m slow"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
