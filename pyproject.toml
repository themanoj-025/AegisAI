[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510", "G201", "RUF034", "S110", "B008"]  # B008: idiomatic FastAPI Security() in defaults

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
