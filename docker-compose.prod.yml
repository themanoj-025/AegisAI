# ═══════════════════════════════════════════════════════════════════════
# AegisAI — Production override
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardening vs base: explicit restart policy, resource limits, no dev
# mounts, secrets via Docker secrets (mount your PEM at
# ./secrets/github-app-private-key.pem or use the secrets: block below).
# ═══════════════════════════════════════════════════════════════════════

services:
  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    # Private key is injected at runtime, never baked into the image.
    # target: renames the mounted secret to github-app-private-key.pem so
    # it lands at /run/secrets/github-app-private-key.pem, matching the
    # GITHUB_PRIVATE_KEY_PATH default in docker-compose.yml.
    secrets:
      - source: github_app_private_key
        target: github-app-private-key.pem

  worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    secrets:
      - source: github_app_private_key
        target: github-app-private-key.pem

secrets:
  github_app_private_key:
    # Expected path: ./secrets/github-app-private-key.pem (gitignored).
    file: ./secrets/github-app-private-key.pem
